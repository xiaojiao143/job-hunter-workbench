name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    name: 核心测试（2482 条断言）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查（32 个模块）
        run: |
          cd "求职猎手工作台"
          for f in js/*.js; do
            node --check "$f" || exit 1
          done
          echo "✅ 32 个 js 模块语法通过"

      - name: 跑核心测试
        run: |
          cd "求职猎手工作台"
          node _测试_核心.js

      - name: 校验示例数据可被导入
        run: |
          cd "求职猎手工作台"
          node -e "
            const fs = require('fs');
            const o = JSON.parse(fs.readFileSync('demo-data/demo-backup.json', 'utf8'));
            if (!Array.isArray(o.jobs) || o.jobs.length === 0) throw new Error('demo 数据缺 jobs');
            if (o._app !== '求职猎手工作台') throw new Error('demo 数据 _app 标识不对');
            console.log('✅ demo 数据合法：' + o.jobs.length + ' 条岗位');
          "

  pack-consistency:
    name: 打包工装完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 手工维护的孪生文件必须入库
        # src/js、src/css、src/index.html、src/favicon.ico 是**派生副本**，
        # 由 sync_src.py --apply 生成、不入库（见 .gitignore）。
        # 但下面这 4 个是手写的、无法再生的，缺了就是打包版真缺东西。
        run: |
          for f in "_打包工程/src/server_core.py" \
                   "_打包工程/src/launcher.py" \
                   "_打包工程/src/browser_finder.py" \
                   "_打包工程/src/probe_drission.py"; do
            if [ ! -f "$f" ]; then echo "✗ 缺少手工维护的孪生文件：$f"; exit 1; fi
            echo "✓ $f"
          done

      - name: sync_src.py 能从源码生成副本且校验通过
        # 先 --apply 生成（CI 里副本是不存在的），再 --check 确认一致。
        # 这同时验证了「新人 clone 下来能自己重建打包目录」这条路径。
        run: |
          cd _打包工程
          python sync_src.py --apply
          python sync_src.py --check

      - name: 服务端双副本语法检查
        run: |
          python -m py_compile "求职猎手工作台/采集器/server.py"
          python -m py_compile "_打包工程/src/server_core.py"
          echo "✅ 两份 server 语法通过"

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>求职猎手工作台</title>
<meta name="description" content="个人求职一站式工作台：BOSS 岗位导入 → AI 解析 → 简历匹配 → 投递跟踪 → 面试管理 → offer 对比。数据只存在你的浏览器里。">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d4ed8'/><text y='70' x='50' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'>猎</text></svg>">
</head>
<body>

<div id="app">
  <!-- 侧边导航 -->
  <aside class="side" id="side">
    <div class="side-brand">
      <div class="side-logo">猎</div>
      <div>
        <b>求职猎手</b>
        <small>工作台 · 本地版</small>
      </div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <!-- 账号区：本机多账号数据沙箱（登录 / 切换 / 登出） -->
    <div class="side-account" id="sideAccount"></div>
    <div class="side-foot">
      <div class="row" style="gap:6px">
        <button class="btn sm" id="btnTheme" title="切换浅色 / 深色" style="flex:1;justify-content:center">🌙 主题</button>
        <button class="btn sm icon" id="btnCollapse" title="收起 / 展开侧边栏">⇤</button>
      </div>
      <!-- 快捷键 / 帮助入口放在明面上，别只藏在「设置 → 关于」最底部 -->
      <button class="btn sm" id="btnHelp" title="快捷键 + 使用边界说明" style="width:100%;justify-content:center;margin-top:6px">
        <span class="hk-ico">⌨</span><span class="hk-txt">&nbsp;快捷键 / 帮助</span>
      </button>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div>
        <h2 id="pgTitle">岗位库</h2>
        <div class="sub" id="pgSub"></div>
      </div>
      <span class="sp"></span>
      <div class="row nowrap" id="topActions" style="gap:7px"></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="toasts"></div>

<!-- 全局 AI 快速唤起 -->
<button class="fab" id="fab" title="AI 求职助手（Ctrl + K）">💬</button>
<div class="quick hide" id="quick">
  <header>
    <span>💬 AI 快速问答</span>
    <span class="sp"></span>
    <button class="btn xs" id="quickExpand" title="打开完整助手">↗ 完整</button>
    <button class="btn xs" id="quickClose">✕</button>
  </header>
  <div class="qbody" id="quickBody"></div>
  <div class="qfoot">
    <input type="text" id="quickInput" placeholder="问点什么…（Enter 发送）">
    <button class="btn pri sm" id="quickSend">发送</button>
  </div>
</div>

<!-- 脚本（用普通 script，file:// 直接双击也能跑，不需要本地服务器） -->
<script>window.Views = {};</script>
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/account.js"></script>
<script src="js/ai.js"></script>
<script src="js/charts.js"></script>
<script src="js/export.js"></script>
<script src="js/components.js"></script>
<script src="js/job-taxonomy.js"></script>
<script src="js/job-picker.js"></script>
<script src="js/geo.js"></script>
<script src="js/company-check.js"></script>
<script src="js/job-match.js"></script>
<script src="js/job-score.js"></script>
<script src="js/ai-collect.js"></script>
<script src="js/pitfall.js"></script>
<script src="js/apply-boss.js"></script>
<script src="js/collect-prefs.js"></script>
<script src="js/view-jobs.js"></script>
<script src="js/view-company.js"></script>
<script src="js/view-followup.js"></script>
<script src="js/interview-sim.js"></script>
<script src="js/resume-doc.js"></script>
<script src="js/view-conflicts.js"></script>
<script src="js/view-collect.js"></script>
<script src="js/view-kanban.js"></script>
<script src="js/view-interview.js"></script>
<script src="js/view-resume.js"></script>
<script src="js/view-assistant.js"></script>
<script src="js/view-compare.js"></script>
<script src="js/view-dashboard.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
